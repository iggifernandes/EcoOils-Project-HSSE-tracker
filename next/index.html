<head>

<title>HSSE Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#231F20;font-family:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
.top{position:fixed;top:8px;right:14px;text-align:right;font-size:11px;color:#8a8a8a;letter-spacing:.06em}
.top .lang{margin-top:3px}
.top .lang button{background:none;border:0;padding:2px 4px;font:inherit;color:#8a8a8a;cursor:pointer;letter-spacing:.06em}
.top .lang button.on{color:#231F20;font-weight:600}
.card{width:100%;max-width:380px}
.logo{display:block;height:36px;margin:0 0 26px}
h1{margin:0 0 6px;font-weight:300;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:#6E6B6C}
.sub{margin:0 0 26px;font-size:14px;color:#6E6B6C}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6E6B6C;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 12px;border:1px solid #DCDCDC;border-radius:8px;background:#fff;color:#231F20;outline:none}
input:focus{border-color:#44A276;box-shadow:0 0 0 3px #CFE8DC}
input.code{font-size:26px;letter-spacing:.5em;text-align:center;padding-left:.5em;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:#8a8a8a;margin:8px 0 18px;line-height:1.45}
.btn{width:100%;font:inherit;font-size:15px;font-weight:500;padding:12px 14px;border:0;border-radius:8px;background:#44A276;color:#fff;cursor:pointer;letter-spacing:.02em}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:#44A276;cursor:pointer}
.link:disabled{color:#a0a0a0;cursor:default}
.row{display:flex;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.msg{min-height:20px;margin:14px 0 0;font-size:13px;line-height:1.4;color:#6E6B6C}
.msg.err{color:#C0392B}
.note{margin-top:26px;font-size:11.5px;color:#9a9a9a;line-height:1.5}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #CFE8DC;border-top-color:#44A276;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
